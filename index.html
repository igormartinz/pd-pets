<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>PD Pets</title>
</head>

<body>
    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand d-lg-none" href="/">
                    <img src="img/logo-mobile.png" alt="Logo PD Pets" class="logo-mobile">
                </a>
                <a class="navbar-brand d-lg-block d-none" href="/">
                    <img src="img/logo-desktop.png" alt="Logo PD Pets" class="logo-desktop">
                </a>

                <!-- MENU HAMBURGUER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Abrir menu de navegação">
                    <i class="ti ti-menu-2 menu-mobile"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex ms-auto" role="search" id="form-pesquisa">
                        <input type="search" class="input-pesquisa" id="input-pesquisa"
                            placeholder="O que você procura hoje?">
                        <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
                    </form>
                    <hr class="d-lg-none">
                    <div class="d-flex ">
                        <ul class="navbar-nav mx-lg-4 me-auto mb-lg-0">
                            <li>
                                <a class="text-decoration-none" href="/pages/carrinho.html"><i
                                        class="ti ti-shopping-cart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" href="/pages/favoritos.html"><i
                                        class="ti ti-heart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" href="/pages/dashboard.html"><i
                                        class="ti ti-user icone-nav"></i></a>
                            </li>
                        </ul>
                        <a class="btn-entrar" href="/pages/login.html">Entrar</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
