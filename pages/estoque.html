<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Lojista");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <title>PD Pets | Estoque</title>
</head>

<body>
    <main>
        <a href="dashboard-lojista.html" class="botao-secundario btn-voltar px-5">Voltar</a>

        <section id="section-estoque">
            <div class="container-header-estoque">
                <h2>Estoque</h2>

                <form role="search" id="form-pesquisa">
                    <div class="input-border-secundario">
                        <input type="search" class="pe-5 form-control input-primario" id="input-pesquisa"
                            placeholder="Busque por um produto">
                    </div>
                    <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
                </form>

                <div class="container-tabela-btns-header">
                    <div class="dropdown">
                        <button class="botao filtro" id="filtro-categoria" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <p>Categorias</p>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M4 4h6v6h-6l0 -6" />
                                <path d="M14 4h6v6h-6l0 -6" />
                                <path d="M4 14h6v6h-6l0 -6" />
                                <path d="M14 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                            </svg>
                        </button>
                        <ul class="dropdown-menu">
                            <li><button type="button" class="dropdown-item" data-categoria="">Todas as categorias</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="1">Ração e Petiscos</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="2">Higiene</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="3">Brinquedos</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="4">Acessórios</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="5">Medicamentos</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="6">Roupas</button></li>
                            <li><button type="button" class="dropdown-item" data-categoria="7">Camas e Casinhas</button></li>
                        </ul>
                    </div>

                    <button class="botao" id="btn-cadastrar-produto" data-bs-target="#modalCriarProduto"
                        data-bs-toggle="modal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-plus">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M12 5l0 14" />
                            <path d="M5 12l14 0" />
                        </svg>

                        Cadastrar produto
                    </button>
                </div>
            </div>

            <div class="table-responsive tabela-estoque">
                <table>
                    <thead>
                        <tr>
                            <th scope="col" class="text-truncate titulos-tabela-estoque coluna-nome-produto">Nome do produto</th>
                            <th scope="col" class="titulos-tabela-estoque coluna-categoria">Categoria</th>
                            <th scope="col" class="titulos-tabela-estoque coluna-preco">Preço</th>
                            <th scope="col" class="titulos-tabela-estoque coluna-estoque">Estoque</th>
                            <th scope="col" class="titulos-tabela-estoque coluna-status">Status</th>
                            <th scope="col" class="titulos-tabela-estoque coluna-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-estoque"></tbody>
                </table>
            </div>
        </section>

        <!-- PAGINAÇÃO -->
        <nav class="mt-4" aria-label="Paginação">
            <ul class="pagination justify-content-end rounded-2" id="paginacao">

            </ul>
        </nav>
    </main>

    <div class="modal fade" id="modalExcluirProduto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-excluir-produto">
                <h2 class="modal-titulo">Excluir produto</h2>

                <p class="texto-modal-excluir-produto">Tem certeza que deseja excluir este produto?</p>

                <div class="container-btns-modal-acoes">
                    <button type="button" class="botao-secundario" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="botao" id="btn-confirmar-exclusao-produto">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCriarProduto" tabindex="-1" aria-labelledby="titulo-modal-criar-produto"
        aria-hidden="true">
        <div class="modal-dialog my-3 modal-dialog-centered">
            <div class="modal-content modal-content-criar-produto">
                <form class="form-modal-produto" id="form-produto" novalidate>
                    <h2 class="modal-titulo mb-3" id="titulo-modal-produto">Criar produto</h2>
                    <div class="container-colunas">
                        <div class="input-grupo">
                            <label for="edit-nome">Nome</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="prod-nome" placeholder="Nome do produto">
                            </div>
                        </div>

                        <div class="container-groups-colunas">
                            <div class="input-grupo">
                                <label for="prod-categoria">Categoria</label>
                                <div class="input-border">
                                    <select class="form-select" id="prod-categoria" name="categoria" required>
                                        
                                    </select>
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="prod-preço">Preço</label>
                                <div class="input-border">
                                    <input type="number" class="form-control" id="prod-preço" placeholder="R$ 0,00" step="0.01" min="0">
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="prod-estoque">Estoque</label>
                                <div class="input-border">
                                    <input type="text" class="form-control" id="prod-estoque" placeholder="0"
                                        maxlength="5" inputmode="numeric">
                                </div>
                            </div>

                            <div class="checkbox-btn-status">
                                <input type="checkbox" id="prod-status" checked>
                                <label for="prod-status">Produto ativo</label>
                            </div>

                            <div class="input-grupo">
                                <label for="prod-descricao">Descrição</label>
                                <div class="input-border">
                                    <textarea class="form-control" name="descricao" id="prod-descricao" rows="5"
                                        placeholder="Descrição do produto"></textarea>
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="prod-imagem">imagem</label>

                                <label class="area-upload" id="area-upload">
                                    <input type="file" id="prod-imagem" name="imagem"
                                        accept="image/png, image/jpeg, image/webp" class="visually-hidden">

                                    <svg class="borda-upload" aria-hidden="true">
                                        <rect width="100%" height="100%" rx="10" ry="10" />
                                    </svg>

                                    <div class="conteudo-upload">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-cloud-upload preview-icon">
                                            <path d="M12 13v8" />
                                            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                                            <path d="m8 17 4-4 4 4" />
                                        </svg>
                                        <p>Arraste a imagem ou clique aqui</p>
                                    </div>

                                    <p class="txt-capacidade-upload">PNG, JPG até 10mb</p>
                                </label>

                            </div>
                        </div>
                    </div>
                    <div class="container-btns-modal-produto mt-4">
                        <div class="container-btns-modal-produto-acoes">
                            <button type="button" class="botao-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="botao" id="btn-salvar-produto">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade " id="modalEditarProduto" tabindex="-1" aria-labelledby="titulo-modal-editar-produto"
        aria-hidden="true">
        <div class="modal-dialog my-3 modal-dialog-centered">
            <div class="modal-content modal-content-criar-produto">
                <form class="form-modal-produto" id="form-editar-produto" novalidate>
                    <h2 class="modal-titulo mb-3" id="titulo-modal-editar-produto">Editar produto</h2>
                    <div class="container-colunas">
                        <div class="input-grupo">
                            <label for="edit-nome">Nome</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="edit-nome" placeholder="Nome do produto">
                            </div>
                        </div>

                        <div class="container-groups-colunas">
                            <div class="input-grupo">
                                <label for="edit-categoria">Categoria</label>
                                <div class="input-border">
                                    <select class="form-select" id="edit-categoria" name="categoria" required>
                                    </select>
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="edit-preço">Preço</label>
                                <div class="input-border">
                                    <input type="number" step="0.01" min="0" class="form-control" id="edit-preco" placeholder="R$ 0,00">
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="edit-estoque">Estoque</label>
                                <div class="input-border">
                                    <input type="text" class="form-control" id="edit-estoque" placeholder="0"
                                        maxlength="5" inputmode="numeric">
                                </div>
                            </div>

                            <div class="checkbox-btn-status">
                                <input type="checkbox" id="edit-status">
                                <label for="edit-status">Produto ativo</label>
                            </div>

                            <div class="input-grupo">
                                <label for="edit-descricao">Descrição</label>
                                <div class="input-border">
                                    <textarea class="form-control" name="descricao" id="edit-descricao" rows="5"
                                        placeholder="Descrição do produto"></textarea>
                                </div>
                            </div>

                            <div class="input-grupo">
                                <label for="area-upload-editar">imagem</label>

                                <label class="area-upload" id="area-upload">
                                    <input type="file" id="area-upload-editar" name="imagem"
                                        accept="image/png, image/jpeg, image/webp" class="visually-hidden">

                                    <svg class="borda-upload" aria-hidden="true">
                                        <rect width="100%" height="100%" rx="10" ry="10" />
                                    </svg>

                                    <div class="conteudo-upload">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-cloud-upload preview-icon">
                                            <path d="M12 13v8" />
                                            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                                            <path d="m8 17 4-4 4 4" />
                                        </svg>
                                        <p>Arraste a imagem ou clique aqui</p>
                                    </div>

                                    <p class="txt-capacidade-upload">PNG, JPG até 10mb</p>
                                </label>

                            </div>
                        </div>
                    </div>
                    <div class="container-btns-modal-produto mt-4">
                        <div class="container-btns-modal-produto-acoes">
                            <button type="button" class="botao-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="botao" id="btn-salvar-edicao">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="/js/estoque.js"></script>
</body>

</html>
