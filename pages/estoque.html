<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Lojista");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <title>PD Pets | Estoque</title>
</head>

<body>
    <main>
        <a href="dashboard-lojista.html" class="botao-secundario btn-voltar px-5">Voltar</a>

        <section id="section-estoque">
            <div class="container-header-estoque">
                <h2>Estoque</h2>

                <form class="d-flex" role="search" id="form-pesquisa">
                    <input type="search" class="input-pesquisa" id="input-pesquisa"
                        placeholder="O que você procura hoje?">
                    <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
                </form>

                <button class="botao" id="btn-categorias">
                    Categorias

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-category">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 4h6v6h-6l0 -6" />
                        <path d="M14 4h6v6h-6l0 -6" />
                        <path d="M4 14h6v6h-6l0 -6" />
                        <path d="M14 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                    </svg>
                </button>

                <button class="botao" id="btn-cadastrar-produto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-plus">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 5l0 14" />
                        <path d="M5 12l14 0" />
                    </svg>

                    Cadastrar produto
                </button>
            </div>
        </section>
    </main>
</body>

</html>
