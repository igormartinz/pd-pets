<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Lojista");</script>
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="stylesheet" href="/css/pedidos-recebidos.css">
    <title>PD Pets | Pedidos Recebidos</title>
</head>

<body>
    <main class="container">
        <a href="dashboard-lojista.html" class="botao-secundario btn-voltar px-5">Voltar</a>

        <div class="d-flex flex-column align-items-center justify-content-center gap-2 flex-md-row justify-content-md-between">
            <h1 class="text-center text-lg-start">Pedidos Recebidos</h1>
            <div class="dropdown">
                <button class="botao border-0 px-4" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">Filtrar <i class="ti ti-filter"></i></button>
                <ul class="dropdown-menu">
                    <li><button class="dropdown-item" data-ordenar="aguardando-pagamento">Aguardando Pagamento</button></li>
                    <li><button class="dropdown-item" data-ordenar="pago">Pago</button></li>
                    <li><button class="dropdown-item" data-ordenar="Separando">Separando</button></li>
                    <li><button class="dropdown-item" data-ordenar="Enviado">Enviado</button></li>
                    <li><button class="dropdown-item" data-ordenar="Entregue">Entregue</button></li>
                    <li><button class="dropdown-item" data-ordenar="Cancelado">Cancelado</button></li>
                </ul>
            </div>
        </div>

        <section id="lista-pedidos-recebidos">

        </section>

        <!-- PAGINAÇÃO -->
        <nav class="mt-4" aria-label="Paginação">
            <ul class="pagination justify-content-end rounded-2" id="paginacao">

            </ul>
        </nav>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script type="module" src="/js/pedidos-recebidos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
