<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Administrador");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/listagem.css">
    <title>PD Pets | Listagem de Produtos</title>
</head>

<body>
    <!-- CONTEUDO -->
    <a href="dashboard-administrador.html" class="botao-secundario btn-voltar px-5">Voltar</a>
    <main class="container">
        <div class="d-flex flex-column align-items-center mb-4 flex-md-row justify-content-md-between gap-3">
            <h1>Listagem de Produtos</h1>

            <form role="search" id="form-pesquisa">
                <div class="input-border-secundario">
                    <input type="search" class="pe-5 form-control input-primario" id="input-pesquisa"
                        placeholder="Busque por nome do produto">
                </div>
                <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
            </form>
        </div>

        <section id="section-listagem-produtos">
            <div class="table-responsive">
                <table class="tabela-listagem">
                    <thead class="tabela-cabecalho">
                        <tr class="pedido-linha">
                            <th scope="col" class="linha-cabecalho">Nome do Produto</th>
                            <th scope="col" class="linha-cabecalho">Lojista Responsável</th>
                            <th scope="col" class="linha-cabecalho">Categoria</th>
                            <th scope="col" class="linha-cabecalho estoque">Estoque</th>
                            <th scope="col" class="linha-cabecalho">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-lista">
                    </tbody>
                </table>
            </div>

            <!-- PAGINAÇÃO -->
            <nav class="mt-4" aria-label="Paginação">
                <ul class="pagination justify-content-end" id="paginacao">
                </ul>
            </nav>
        </section>
    </main>

    <!-- MODAL DESATIVAR PRODUTO -->
    <div class="modal fade" id="modalDesativarProduto" tabindex="-1" aria-labelledby="modalDesativarProduto"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-desativar p-3 rounded-3">
                <h2 class="modal-titulo-desativar fs-5 text-center">Desativar produto</h2>
                <p class="text-center">Tem certeza que deseja desativar o produto <strong
                        id="nome-produto-desativar"></strong>?</p>
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <button type="button" class="botao-secundario px-0 w-50" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="botao px-0 w-50" id="btn-confirmar-desativar">Desativar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div id="toast-indicador" class="rounded-1" style="width: 1em; height: 1em;"></div>
                <strong id="toast-titulo" class="me-auto ms-2"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
            <div id="toast-mensagem" class="toast-body"></div>
        </div>
    </div>

    <script type="module" src="/js/listagem-produtos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
