<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/meus-pets.css">
    <title>PD Pets | Meus Pets</title>
</head>

<body>
    <!-- CABEÇALHO -->
    <header class="cabecalho" id="cabecalho">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand d-lg-none" href="/">
                    <img src="../img/logo-mobile.png" alt="Logo PD Pets" class="logo-mobile">
                </a>
                <a class="navbar-brand d-lg-block d-none" href="/">
                    <img src="../img/logo-desktop.png" alt="Logo PD Pets" class="logo-desktop">
                </a>

                <!-- MENU HAMBURGUER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Abrir menu de navegação">
                    <i class="ti ti-menu-2 menu-mobile"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex ms-auto" role="search" id="form-pesquisa">
                        <input type="search" class="input-pesquisa" id="input-pesquisa"
                            placeholder="O que você procura hoje?">
                        <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
                    </form>
                    <hr class="d-lg-none">
                    <div class="d-flex ">
                        <ul class="navbar-nav mx-lg-4 me-auto mb-lg-0">
                            <li>
                                <a class="text-decoration-none" href="/pages/carrinho.html"><i
                                        class="ti ti-shopping-cart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" href="/pages/favoritos.html"><i
                                        class="ti ti-heart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" id="link-perfil" href="/pages/dashboard.html"><i
                                        class="ti ti-user icone-nav"></i></a>
                            </li>
                        </ul>
                        <a class="botao" href="/pages/login.html">Entrar</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTEUDO -->
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Meus Pets</h1>
            <button type="button" class="botao px-3" id="btn-cadastrar-pet">Cadastrar novo
                Pet</button>
        </div>

        <p id="sem-pets" class="d-none">Nenhum pet encontrado.</p>

        <section class="row g-3" id="lista-pets"></section>
    </main>

    <!-- RODAPE -->
    <footer class="rodape">
        <div class="container-fluid conteudo-rodape">
            <div class="row pt-3 pt-lg-0">
                <div class="col-12 col-lg-4 mb-3 mb-lg-0">
                    <img src="/img/logo-desktop.png" alt="Logo PD Pets" class="logo-rodape d-block mx-auto mx-lg-0">
                    <p class="texto-rodape text-lg-start">O pet shop online que cuida do seu melhor amigo.</p>
                </div>

                <div class="col-6 col-lg-4 mb-3 mb-lg-0">
                    <h2 class="titulo-rodape text-center">Redes Sociais</h2>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="https://www.instagram.com/pdcaseinformatica/" target="_blank" class="rodape-link"><i
                                class="rodape-icones ti ti-brand-instagram"></i></a>
                        <a href="https://www.facebook.com/pdcaseinformatica/" target="_blank" class="rodape-link"><i
                                class="rodape-icones ti ti-brand-facebook"></i></a>
                        <a href="https://www.youtube.com/channel/UCU_a1h5vy4_rLolioMv1G9Q" target="_blank"
                            class="rodape-link"><i class="rodape-icones ti ti-brand-youtube"></i></a>
                        <a href="https://www.linkedin.com/company/pd-case-informatica-ltda/posts/" target="_blank"
                            class="rodape-link"><i class="rodape-icones ti ti-brand-linkedin"></i></a>
                    </div>
                </div>
                <div class="col-6 col-lg-4 mb-3 mb-lg-0 linha-rodape">
                    <div class="mx-auto rodape-endereco">
                        <h2 class="titulo-rodape">Endereço</h2>
                        <p class="m-0">Alameda Oscar, 891</p>
                        <p class="m-0">Vila da Serra, Nova Lima - MG</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="copyrigth">
            <p class="m-0">© 2026 PD Pets. Todos os Direitos Reservados</p>
        </div>
    </footer>

    <!-- MODAIS -->
    <!-- Modal Excluir Pet -->
    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-labelledby="modalExcluir" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content p-3 rounded-3">
                <h2 class="modal-title fs-5 text-center" id="titulo-modal-excluir">Remover Pet</h2>
                <p class="text-center">Deseja remover esse pet?</p>
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <button type="button" class="botao-secundario px-0 w-50" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="botao px-0 w-50" id="btn-confirmar-exclusao">Remover</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPet" tabindex="-1" aria-labelledby="titulo-modal-pet" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <h2 class="modal-titulo mb-3" id="titulo-modal-pet">Cadastrar Pet</h2>
                <form class="row gy-2" id="form-pet" novalidate>
                    <div class="col-12 col-md-6 d-flex flex-column gap-2">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="pet-nome">Nome</label>
                            <div class="input-border">
                                <input type="text" class="form-control input-contato" id="pet-nome"
                                    placeholder="Digite o nome">
                            </div>
                        </div>
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="pet-especie">Espécie</label>
                            <div class="input-border">
                                <input type="text" class="form-control input-contato" id="pet-especie"
                                    placeholder="Digite a espécie">
                            </div>
                        </div>
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="pet-raca">Raça</label>
                            <div class="input-border">
                                <input type="text" class="form-control input-contato" id="pet-raca"
                                    placeholder="Digite a raça">
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 d-flex flex-column gap-2">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="pet-idade">Idade (anos)</label>
                            <div class="input-border">
                                <input type="number" min="0" step="1" class="form-control input-contato" id="pet-idade"
                                    placeholder="Digite a idade">
                            </div>
                        </div>
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="pet-peso">Peso (kg)</label>
                            <div class="input-border">
                                <input type="number" min="0" step="0.1" class="form-control input-contato" id="pet-peso"
                                    placeholder="Digite o peso">
                            </div>
                        </div>
                        <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                            <button type="button" class="botao-secundario px-0 w-50"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="botao px-0 w-50" id="btn-salvar-pet">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div id="toast-indicador" class="rounded-1" style="width: 1em; height: 1em;"></div>
                <strong id="toast-titulo" class="me-auto ms-2"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
            <div id="toast-mensagem" class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioLogado = verificarAut("Cliente");
        });
    </script>
    <script src="../js/pesquisa-catalogo.js"></script>
    <script type="module" src="/js/meus-pets.js"></script>
</body>

</html>
