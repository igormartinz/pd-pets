<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <title>PD Pets | Login</title>
</head>

<body>
    <!-- CONTEUDO -->
    <a href="cadastro-lojista.html" class="botao-secundario btn-lojista px-3">Seja um parceiro!</a>
    <main class="container">
        <section class="entrar">
            <picture>
                <source srcset="/img/logo-desktop.png" class="logo-desktop" media="(min-width: 992px)">
                <img src="/img/logo-mobile.png" class="logo-mobile" alt="Logo PD Pets">
            </picture>

            <h1>Entrar</h1>

            <form class="d-flex flex-column gap-3">

                <div class="d-flex flex-column campo-input">
                    <label for="email">E-mail</label>
                    <div class="input-border">
                        <input type="email" name="email" id="email" class="form-control input-primario" required
                            placeholder="Digite seu e-mail">
                    </div>
                </div>

                <div class="d-flex flex-column campo-input w-100">
                    <label for="senha">Senha</label>
                    <div class="input-border">
                        <input type="password" name="senha" class="form-control input-primario" id="senha" required
                            placeholder="Digite seu senha">
                    </div>
                </div>

                <div class="d-flex flex-column gap-1">
                    <input type="radio" name="perfil" id="cliente" class="d-none" value="cliente" checked>
                    <div>
                        <input type="radio" name="perfil" id="lojista" value="lojista">
                        <label for="lojista">Sou lojista</label>
                    </div>
                    <div>
                        <input type="radio" name="perfil" id="administrador" value="administrador">
                        <label for="administrador">Sou administrador</label>
                    </div>
                </div>

                <a href="recuperacao-senha.html" class="entrar-link">Esqueci minha senha</a>

                <div class="d-flex gap-3">
                    <a href="/index.html" class="botao-secundario w-100">Voltar</a>
                    <input type="submit" value="Enviar" class="botao border-0 w-100">
                </div>
            </form>
            <p class="mt-4 mb-0 text-center">Não possui uma conta? <a href="cadastro-cliente.html"
                    class="entrar-link">Crie uma!</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/login.js"></script>
</body>

</html>
