<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>PD Pets | Cadastro</title>
</head>

<body>
    <!-- CONTEUDO -->
    <main class="container">
        <section class="cadastro">

            <h1>Crie uma Conta</h1>
            <p>Crie sua conta na PD Pets, para ficar informado das ofertas, sorteios, descontos e muito mais!</p>

            <form class="d-flex flex-column gap-2" id="form-cadastro">

                <!-- DADOS PESSOAIS -->
                <div class="d-flex flex-column campo-input w-100">
                    <label for="nome">Nome</label>
                    <div class="input-border">
                        <input type="text" name="nome" class="form-control input-primario" id="nome"
                            placeholder="Digite seu nome completo">
                    </div>
                </div>

                <div class="row gy-2">
                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="email">E-mail</label>
                            <div class="input-border">
                                <input type="email" name="email" id="email" class="form-control input-primario"
                                    placeholder="Digite seu e-mail">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="cpf">CPF</label>
                            <div class="input-border">
                                <input type="text" name="cpf" class="form-control input-primario" id="cpf"
                                    placeholder="Digite seu CPF" inputmode="numeric" maxlength="15">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="telefone">Telefone</label>
                            <div class="input-border">
                                <input type="tel" name="telefone" class="form-control input-primario" id="telefone"
                                    placeholder="Digite seu telefone" inputmode="numeric" maxlength="15">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="data-nascimento">Data de Nascimento</label>
                            <div class="input-border">
                                <input type="date" name="data-nascimento" class="form-control input-primario"
                                    id="data-nascimento">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="senha">Senha</label>
                            <div class="input-border">
                                <input type="password" name="senha" class="form-control input-primario" id="senha"
                                    placeholder="Digite sua senha">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="senha-confirmacao">Confirmação de Senha</label>
                            <div class="input-border">
                                <input type="password" name="senha-confirmacao" class="form-control input-primario"
                                    id="senha-confirmacao" placeholder="Confirme sua senha">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ENDERECO -->
                <h2>Cadastre seu endereço</h2>

                <div class="row gy-2">
                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="cep">CEP</label>
                            <div class="input-border">
                                <input type="text" name="cep" class="form-control input-primario" id="cep"
                                    placeholder="Digite seu CEP" inputmode="numeric" maxlength="9">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="cidade">Cidade</label>
                            <div class="input-border">
                                <input type="text" name="cidade" class="form-control input-primario" id="cidade"
                                    placeholder="Digite sua cidade">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="bairro">Bairro</label>
                            <div class="input-border">
                                <input type="text" name="bairro" class="form-control input-primario" id="bairro"
                                    placeholder="Digite seu bairro">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="estado">Estado</label>
                            <div class="input-border">
                                <input type="text" name="estado" class="form-control input-primario" id="estado"
                                    placeholder="Digite seu estado">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="rua">Rua</label>
                            <div class="input-border">
                                <input type="text" name="rua" class="form-control input-primario" id="rua"
                                    placeholder="Digite sua rua">
                            </div>
                        </div>

                        <div class="row">
                            <div class="d-flex flex-column campo-input col-6">
                                <label for="numero">Número</label>
                                <div class="input-border">
                                    <input type="text" name="numero" class="form-control input-primario" id="numero"
                                        placeholder="Digite seu número">
                                </div>
                            </div>
                            <div class="d-flex flex-column campo-input col-6">
                                <label for="complemento">Complemento</label>
                                <div class="input-border">
                                    <input type="text" name="complemento" class="form-control input-primario"
                                        id="complemento" placeholder="Digite seu complemento">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-3">
                    <a href="login.html" class="botao-secundario w-100">Voltar</a>
                    <input type="submit" value="Enviar" class="botao border-0 w-100">
                </div>
            </form>
        </section>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script src="../js/cadastro-cliente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
