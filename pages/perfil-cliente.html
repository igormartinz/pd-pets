<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/perfil-cliente.css">
    <title>PD Pets | Perfil</title>
</head>

<body>
    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand d-lg-none" href="/">
                    <img src="/img/logo-mobile.png" alt="Logo PD Pets" class="logo-mobile">
                </a>
                <a class="navbar-brand d-lg-block d-none" href="/">
                    <img src="/img/logo-desktop.png" alt="Logo PD Pets" class="logo-desktop">
                </a>

                <!-- MENU HAMBURGUER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Abrir menu de navegação">
                    <i class="ti ti-menu-2 menu-mobile"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex ms-auto" role="search" id="form-pesquisa">
                        <input type="search" class="input-pesquisa" id="input-pesquisa"
                            placeholder="O que você procura hoje?">
                        <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
                    </form>
                    <hr class="d-lg-none">
                    <div class="d-flex ">
                        <ul class="navbar-nav mx-lg-4 me-auto mb-lg-0">
                            <li>
                                <a class="text-decoration-none" href="/pages/carrinho.html"><i
                                        class="ti ti-shopping-cart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" href="/pages/favoritos.html"><i
                                        class="ti ti-heart icone-nav"></i></a>
                            </li>
                            <li>
                                <a class="text-decoration-none" id="link-perfil" href="/pages/login.html"><i
                                        class="ti ti-user icone-nav"></i></a>
                            </li>
                        </ul>
                        <a class="botao" href="/pages/login.html">Entrar</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <section id="section-perfil-cliente">
            <h2>Meu Perfil</h2>

            <section id="section-perfil-cliente-endereco">
                <section id="section-form-dados-perfil">
                    <div class="perfil-header">
                        <div class="circulo-perfil">
                            <p class="abrev-nome"></p>
                        </div>

                        <div class="nome-e-email-perfil">
                            <h3 class="nome-usuario"></h3>
                            <p class="email-usuario"></p>
                        </div>

                        <div class="container-btns-perfil">
                            <button class="botao" id="btn-editar-perfil">Editar</button>
                            <button type="button" class="botao d-none" id="btn-salvar-perfil">Salvar</button>
                        </div>
                    </div>


                    <form class="d-flex flex-column form-perfil-cliente">
                        <div class="campo-dados-perfil">
                            <label for="CPF">CPF</label>
                            <i class="ti ti-lock cadeado-cpf d-none" id="cadeado-cpf"
                                aria-label="Campo não editável"></i>
                            <div class="">
                                <input class="input-dados-perfil" type="text" id="CPF" placeholder="" readonly="true">
                            </div>
                        </div>

                        <div class="campo-dados-perfil">
                            <label for="data-nascimento">Data de nascimento</label>
                            <i class="ti ti-lock cadeado-cpf d-none" id="cadeado-data-nascimento"
                                aria-label="Campo não editável"></i>
                            <div class="">
                                <input class="input-dados-perfil" type="text" id="data-nascimento" placeholder=""
                                    readonly="true">
                            </div>
                        </div>

                        <div class="campo-dados-perfil">
                            <label for="email">E-mail</label>
                            <div class="">
                                <input class="input-dados-perfil" type="email" id="email" placeholder=""
                                    readonly="true">
                            </div>
                        </div>

                        <div class="campo-dados-perfil">
                            <label for="telefone">Telefone</label>
                            <div class="">
                                <input class="input-dados-perfil" type="tel" id="telefone" placeholder=""
                                    readonly="true">
                            </div>
                        </div>

                        <div class="campo-dados-perfil">
                            <label for="senha">Senha</label>
                            <div class="">
                                <input class="input-dados-perfil" type="password" id="senha" placeholder=""
                                    readonly="true">
                            </div>
                        </div>

                        <button type="button" class="d-none" id="btn-cancelar-perfil">Cancelar</button>
                    </form>
                </section>

                <div class="container-endereco">
                    <div class="enderecos-header">
                        <h3 id="titulo-enderecos">Endereços</h3>

                        <button class="botao-novo-endereco" id="btn-novo-endereco">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M12 5l0 14" />
                                <path d="M5 12l14 0" />
                            </svg>
                            Novo
                        </button>
                    </div>

                    <div class="container-item-endereco-overflow" id="lista-enderecos"></div>
                </div>
            </section>
        </section>
    </main>

    <!-- RODAPE -->
    <footer class="rodape">
        <div class="container-fluid conteudo-rodape">
            <div class="row pt-3 pt-lg-0">
                <div class="col-12 col-lg-4 mb-3 mb-lg-0">
                    <img src="/img/logo-desktop.png" alt="Logo PD Pets" class="logo-rodape d-block mx-auto mx-lg-0">
                    <p class="texto-rodape text-lg-start">O pet shop online que cuida do seu melhor amigo.</p>
                </div>

                <div class="col-6 col-lg-4 mb-3 mb-lg-0">
                    <h2 class="titulo-rodape text-center">Redes Sociais</h2>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="https://www.instagram.com/pdcaseinformatica/" target="_blank" class="rodape-link"><i
                                class="rodape-icones ti ti-brand-instagram"></i></a>
                        <a href="https://www.facebook.com/pdcaseinformatica/" target="_blank" class="rodape-link"><i
                                class="rodape-icones ti ti-brand-facebook"></i></a>
                        <a href="https://www.youtube.com/channel/UCU_a1h5vy4_rLolioMv1G9Q" target="_blank"
                            class="rodape-link"><i class="rodape-icones ti ti-brand-youtube"></i></a>
                        <a href="https://www.linkedin.com/company/pd-case-informatica-ltda/posts/" target="_blank"
                            class="rodape-link"><i class="rodape-icones ti ti-brand-linkedin"></i></a>
                    </div>
                </div>
                <div class="col-6 col-lg-4 mb-3 mb-lg-0 linha-rodape">
                    <div class="mx-auto rodape-endereco">
                        <h2 class="titulo-rodape">Endereço</h2>
                        <p class="m-0">Alameda Oscar, 891</p>
                        <p class="m-0">Vila da Serra, Nova Lima - MG</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="copyrigth">
            <p class="m-0">© 2026 PD Pets. Todos os Direitos Reservados</p>
        </div>
    </footer>

    <div class="modal fade" id="modalEndereco" tabindex="-1" aria-labelledby="titulo-modal-endereco" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form class="form-modal-endereco" id="form-endereco" novalidate>
                    <h2 class="modal-titulo mb-3" id="titulo-modal-endereco">Novo Endereço</h2>
                    <div class="container-groups-colunas">
                        <div class="input-grupo">
                            <label for="end-cep">CEP</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="end-cep" placeholder="00000-000">
                            </div>
                        </div>
                        <div class="input-grupo">
                            <label for="end-cidade">Cidade</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="end-cidade" placeholder="Digite sua cidade">
                            </div>
                        </div>
                        <div class="input-grupo">
                            <label for="end-bairro">Bairro</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="end-bairro" placeholder="Digite seu bairro">
                            </div>
                        </div>
                        <div class="input-grupo">
                            <label for="end-estado">Estado</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="end-estado" placeholder="MG" maxlength="2">
                            </div>
                        </div>
                        <div class="input-grupo">
                            <label for="end-rua">Rua</label>
                            <div class="input-border">
                                <input type="text" class="form-control" id="end-rua" placeholder="Digite sua rua">
                            </div>
                        </div>
                        <div class="container-ultimos-inputs">
                            <div class="input-group-num">
                                <label for="end-numero">Número</label>
                                <div class="input-border">
                                    <input type="number" class="form-control" id="end-numero" placeholder="Nº">
                                </div>
                            </div>
                            <div class="input-group-comp">
                                <label for="end-complemento">Complemento</label>
                                <div class="input-border">
                                    <input type="text" class="form-control" id="end-complemento"
                                        placeholder="Apto, casa...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="container-btns-modal-endereco mt-4">
                        <div class="checkbox-btn-principal">
                            <input type="checkbox" id="end-principal">
                            <label for="end-principal">Definir como principal</label>
                        </div>
                        <div class="container-btns-modal-acoes">
                            <button type="button" class="botao-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="botao" id="btn-salvar-endereco">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalExcluirEndereco" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-excluir-endereco">
                <h2 class="modal-titulo">Excluir Endereço</h2>

                <p class="texto-modal-excluir-endereco">Deseja remover esse endereço?</p>

                <div class="container-btns-modal-acoes">
                    <button type="button" class="botao-secundario" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="botao" id="btn-confirmar-exclusao-endereco">Remover</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div id="toast-indicador" class="rounded-1" style="width: 1em; height: 1em;"></div>
                <strong id="toast-titulo" class="me-auto ms-2"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
            <div id="toast-mensagem" class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioLogado = verificarAut("cliente");
        });
    </script>
    <script type="module" src="/js/perfil-cliente.js"></script>
    <script type="module" src="/js/endereco.js"></script>
</body>

</html>
