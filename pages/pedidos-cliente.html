<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Cliente");</script>
    <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pedidos-cliente.css">
    <title>PD Pets | Pedidos</title>
</head>

<body>

    <main class="container">
        <a href="dashboard-cliente.html" class="botao-secundario btn-voltar px-5">Voltar</a>

        <h1>Meus Pedidos</h1>

        <!-- LISTAGEM DE PEDIDOS -->
        <section id="lista-pedidos">

        </section>

        <!-- PAGINAÇÃO -->
        <nav class="mt-4" aria-label="Paginação">
            <ul class="pagination justify-content-end rounded-2" id="paginacao">

            </ul>
        </nav>
    </main>

    <!-- MODAIS -->
    <div class="modal fade" id="modalCancelarPedido" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-cancelar-pedido">
                <h2 class="modal-titulo">Cancelar pedido</h2>

                <div>
                    <p class="texto-modal-cancelar-pedido text-center">Deseja cancelar esse pedido?</p>
                    <p class="texto-modal-cancelar-pedido text-center">Essa ação não pode ser desfeita!</p>
                </div>

                <div class="container-btns-modal-acoes">
                    <button type="button" class="btn-cancelar" data-bs-dismiss="modal">Voltar</button>
                    <button type="button" id="btn-confirmar-cancelamento" class="btn-remover">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAvaliarProduto" tabindex="-1" aria-labelledby="modalAvaliarProduto"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <h2 class="modal-titulo text-left">Avaliar produto</h2>
                <p class="mb-3 text-left">Como foi sua experiência com este produto?</p>
                <form class="row gy-2">
                    <div class="text-center avaliacao-estrelas" id="avaliacao-estrelas">
                        <i class="ti ti-star" data-nota="1"></i>
                        <i class="ti ti-star" data-nota="2"></i>
                        <i class="ti ti-star" data-nota="3"></i>
                        <i class="ti ti-star" data-nota="4"></i>
                        <i class="ti ti-star" data-nota="5"></i>
                    </div>
                    <div class="d-flex flex-column campo-input">
                        <div class="input-border">
                            <textarea name="comentario" id="comentario" class="form-control input-contato"
                                placeholder="Comentário" rows="5"></textarea>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                        <button type="button" class="botao-secundario px-0 w-50" data-bs-dismiss="modal">Voltar</button>
                        <button type="button" id="btn-enviar-avaliacao" class="botao px-0 w-50">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script type="module" src="/js/pedidos-cliente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
