<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Administrador");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/listagem.css">
    <title>PD Pets | Listagem de Pedidos</title>
</head>

<body>
    <main class="container">
        <a href="dashboard-lojista.html" class="botao-secundario btn-voltar px-5">Voltar</a>

        <div class="d-flex justify-content-between align-items-center header-listagem-pedidos">
            <h2 class="titulo-listagem-pedidos">Listagem de Pedidos</h2>

            <form role="search" id="form-pesquisa">
                <div class="input-border-secundario">
                    <input type="search" class="pe-5 form-control input-primario" id="input-pesquisa"
                        placeholder="Busque por nome, ID, status do pedido">
                </div>
                <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
            </form>
        </div>

        <section class="row g-3" id="lista-pedidos-adm">
            <div class="col-12 col-md-6 col-lg-3">
                <article class="card-pedido h-100">
                    <div class="header-card-pedido">
                        <div class="Id-nome-pedidos-info">
                            <p id="idPedido" class="id-pedido">#28</p>
                            <p id="nomePedido" class="nome-pedido">Ana Luiza Silva</p>
                        </div>

                        <span id="statusProduto" class="pago">Pago</span>
                    </div>

                    <div class="container-info-pedido-adm">
                        <div class="box-lojista">
                            <p>Lojista</p>
                            <p id="nomePedido">Rafael</p>
                        </div>
                        <div class="box-data">
                            <p>Data</p>
                            <p id="dataPedido">26/08/2026</p>
                        </div>
                        <div class="box-valor-total">
                            <p>Valor total</p>
                            <p id="valorTotalPedido">R$ 41,99</p>
                        </div>
                        <div class="box-itens">
                            <p>Itens</p>
                            <p id="itensPedido">1</p>
                        </div>
                    </div>

                    <button class="botao-secundario" data-bs-toggle="modal" data-bs-target="#modalVerDetalhes">Ver
                        produtos</button>
                </article>
            </div>
        </section>
    </main>

    <!-- MODAL VER DETALHES -->
    <div class="modal fade" id="modalVerDetalhes" tabindex="-1" aria-labelledby="modalVerDetalhesLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-4 modal-detalhes-pedido">
                <h2 class="titulo-detalhes" id="modalVerDetalhesLabel">Produto(s)</h2>
                <section class="produtos-pedido">
                    <div class="d-flex flex-column gap-2 lista-produtos-detalhes" id="detalhes-produtos">
                        <article class="produto">
                            <h4 class="text-truncate mb-1">Catnip Cansei de Ser Gato Spray 100 ml</h4>
                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <p class="produto-quantidade">Quantidade: <span>1</span></p>
                                    <p class="produto-preco-total">R$ 41,99</p>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>
                <button type="button" class="botao-secundario align-self-end mt-2"
                    data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
