<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Cliente");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/suporte.css">
    <title>PD Pets | Suporte</title>
</head>

<body>
    <!-- CONTEUDO -->
    <a href="dashboard-cliente.html" class="botao-secundario btn-voltar px-5">Voltar</a>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Suporte</h1>
            <button class="botao px-3 d-flex align-items-center gap-2" data-bs-toggle="modal"
                data-bs-target="#modalAbrirChamado"><i class="ti ti-message-circle-plus"></i> Abrir chamado</button>
        </div>

        <section class="row g-3" id="lista-chamados">
        </section>

        <!-- PAGINAÇÃO -->
        <nav class="mt-4" aria-label="Paginação">
            <ul class="pagination justify-content-end rounded-2" id="paginacao">

            </ul>
        </nav>
    </main>

    <!-- MODAIS -->
    <!-- Modal Abrir Chamado-->
    <div class="modal fade" id="modalAbrirChamado" tabindex="-1" aria-labelledby="modalAbrirChamado" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <h2 class="modal-titulo">Formulário de chamado</h2>
                <p class="mb-3">Descreva como podemos ajudar</p>
                <form class="row gy-2" id="form-chamado">
                    <div class="d-flex flex-column campo-input w-100">
                        <div class="input-border">
                            <input type="text" name="assunto" class="form-control p-2 input-contato" id="assunto"
                                placeholder="Assunto" required>
                        </div>
                    </div>
                    <div class="d-flex flex-column campo-input">
                        <div class="input-border">
                            <textarea name="descricao" id="descricao" class="form-control input-contato"
                                placeholder="Descrição" rows="5" required></textarea>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                        <button type="button" class="botao-secundario px-0 w-50"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="botao px-0 w-50" id="btn-enviar-chamado">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Avaliar Chamado-->
    <div class="modal fade" id="modalAvaliarChamado" tabindex="-1" aria-labelledby="modalAvaliarChamado"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <h2 class="modal-titulo">Avaliar atendimento</h2>
                <p class="mb-3">Como foi sua experiência com este atendimento?</p>
                <form class="row gy-2">
                    <div class="text-center avaliacao-estrelas" id="avaliacao-estrelas">
                        <i class="ti ti-star" data-nota="1"></i>
                        <i class="ti ti-star" data-nota="2"></i>
                        <i class="ti ti-star" data-nota="3"></i>
                        <i class="ti ti-star" data-nota="4"></i>
                        <i class="ti ti-star" data-nota="5"></i>
                    </div>
                    <div class="d-flex flex-column campo-input">
                        <div class="input-border">
                            <textarea name="comentario" id="comentario" class="form-control input-contato"
                                placeholder="Comentário" rows="5"></textarea>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                        <button type="button" class="botao-secundario px-0 w-50"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="botao px-0 w-50">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Detalhes Chamado-->
    <div class="modal fade" id="modalDetalhesChamado" tabindex="-1" aria-labelledby="modalDetalhesChamado"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <div class="gap-2 mb-3 container-titulo-modal-detalhes">
                    <h2 class="modal-titulo" id="detalhes-titulo"></h2>
                    <p class="badge rounded-pill p-2 px-4 status-atendimento" id="detalhes-status"></p>
                </div>

                <div class="container-datas-detalhes">
                    <small class="d-block" id="detalhes-abertura"></small>
                    <small class="d-block" id="detalhes-atualizacao"></small>
                </div>

                <div class="d-flex flex-column gap-3 my-4" id="detalhes-mensagens"></div>

                <p class="text-center d-none" id="aviso-resolvido">Este chamado foi resolvido e não recebe novas
                    respostas.</p>

                <form class="row gy-2" id="form-resposta">
                    <div class="d-flex flex-column campo-input">
                        <div class="input-border">
                            <input type="text" name="resposta" id="resposta" class="form-control p-2 input-contato"
                                placeholder="Resposta">
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                        <button type="button" class="botao-secundario px-0 w-50"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="botao px-0 w-50" id="btn-enviar-resposta">Responder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../js/suporte.js"></script>
</body>

</html>
