<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>PD Pets | Cadastro</title>
</head>

<body>
    <!-- CONTEUDO -->
    <main class="container">
        <section class="cadastro">

            <h1>Crie uma Conta</h1>
            <p>Insira os dados da sua empresa, para começar a vender na PD Pets como nosso parceiro!</p>

            <form class="d-flex flex-column gap-2">

                <!-- DADOS PESSOAIS -->
                <div class="d-flex flex-column campo-input w-100">
                    <label for="nome-responsavel">Nome do responsável</label>
                    <div class="input-border">
                        <input type="text" name="nome-responsavel" class="form-control input-primario" id="nome-responsavel" required
                            placeholder="Digite o nome do responsável ">
                    </div>
                </div>

                <div class="row gy-2">
                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="email">E-mail</label>
                            <div class="input-border">
                                <input type="email" name="email" id="email" class="form-control input-primario" required
                                    placeholder="Digite seu e-mail">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="cnpj">CNPJ</label>
                            <div class="input-border">
                                <input type="text" name="cnpj" class="form-control input-primario" id="cnpj" required
                                    placeholder="Digite seu CNPJ">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="telefone">Telefone</label>
                            <div class="input-border">
                                <input type="tel" name="telefone" class="form-control input-primario" id="telefone"
                                    required placeholder="Digite seu telefone">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2 col-12 col-md-6">
                        <div class="d-flex flex-column campo-input w-100">
                            <label for="nome-empresa">Nome da empresa</label>
                            <div class="input-border">
                                <input type="text" name="nome-empresa" class="form-control input-primario"
                                    id="nome-empresa" placeholder="Digite o nome da empresa" required>
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="senha">Senha</label>
                            <div class="input-border">
                                <input type="password" name="senha" class="form-control input-primario" id="senha"
                                    required placeholder="Digite sua senha">
                            </div>
                        </div>

                        <div class="d-flex flex-column campo-input w-100">
                            <label for="senha-confirmacao">Confirmação de Senha</label>
                            <div class="input-border">
                                <input type="text" name="senha-confirmacao" class="form-control input-primario"
                                    id="senha-confirmacao" required placeholder="Confirme sua senha">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-3">
                    <a href="login.html" class="botao-secundario w-100">Voltar</a>
                    <input type="submit" value="Enviar" class="botao border-0 w-100">
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
