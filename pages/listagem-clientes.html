<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Administrador");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/listagem.css">
    <title>PD Pets | Listagem de Clientes</title>
</head>

<body>
    <!-- CONTEUDO -->
    <a href="dashboard-administrador.html" class="botao-secundario btn-voltar px-5" id="btn-voltar">Voltar</a>
    <main class="container">
        <div class="d-flex flex-column align-items-center mb-4 flex-md-row justify-content-md-between gap-3">
            <h1>Listagem de Clientes</h1>

            <form role="search" id="form-pesquisa">
                <div class="input-border-secundario">
                    <input type="search" class="pe-5 form-control input-primario" id="filtro-clientes" placeholder="Busque por nome ou CPF">
                </div>
                <button type="submit" id="btn-pesquisa"><i class="ti ti-search icone-lupa"></i></button>
            </form>
        </div>

        <section>
            <div class="table-responsive">
                <table class="tabela-clientes">
                    <thead class="tabela-cabecalho">
                        <tr class="pedido-linha">
                            <th scope="col" class="linha-cabecalho">Nome Completo</th>
                            <th scope="col" class="linha-cabecalho">E-mail</th>
                            <th scope="col" class="linha-cabecalho">Telefone</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes-lista">

                    </tbody>
                </table>
            </div>

            <!-- PAGINAÇÃO -->
            <nav class="mt-4" aria-label="Paginação">
                <ul class="pagination justify-content-end rounded-2" id="paginacao">

                </ul>
            </nav>
        </section>
    </main>

    <!-- MODAL DETALHES DO USUARIO -->
    <div class="modal fade" id="modalDetalhesUsuario" tabindex="-1" aria-labelledby="tituloDetalhesUsuario"
        aria-hidden="true">
        <div class="modal-dialog my-3 modal-dialog-centered">
            <div class="modal-content">
                <h2 class="modal-titulo mb-3" id="tituloDetalhesUsuario"></h2>
                <p class="mb-2">E-mail: <span id="detalhes-usuario-email"></span></p>
                <p class="mb-2">CPF: <span id="detalhes-usuario-cpf"></span></p>
                <p class="mb-2">Telefone: <span id="detalhes-usuario-telefone"></span></p>
                <p class="mb-4">Data de Nascimento: <span id="detalhes-usuario-nascimento"></span></p>
                <button type="button" class="botao-secundario align-self-end px-5"
                    data-bs-dismiss="modal">Voltar</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script type="module" src="/js/listagem-clientes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
