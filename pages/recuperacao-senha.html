<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/recuperacao-senha.css">
    <title>PD Pets | Recuperar Senha</title>
</head>

<body>
    <!-- CONTEUDO -->
    <main class="container">
        <section class="recuperar-senha">
            <h1>Recuperação de Senha</h1>
            <p>Informe o e-mail cadastrado na sua conta PD Pets. Vamos te ajudar a criar uma nova senha em poucos
                passos.</p>

            <form class="d-flex flex-column gap-3" id="form-recuperar-senha">
                <div class="d-flex flex-column campo-input">
                    <label for="email" class="d-none"></label>
                    <div class="input-border">
                        <input type="email" name="email" id="email" class="form-control input-primario"
                            placeholder="E-mail">
                    </div>
                </div>

                <div class="d-flex gap-3 w-100">
                    <a href="login.html" class="botao-secundario ms-auto">Voltar</a>
                    <button type="submit" id="btn-enviar-email" class="botao border-0">Enviar</button>
                </div>
            </form>
        </section>
    </main>

    <!-- MODAL PARA REDEFINIR SENHA -->
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <p>Escolha uma nova senha com no mínimo 8 caracteres para continuar.</p>
                <form class="d-flex flex-column gap-3" id="form-nova-senha">
                    <div class="d-flex flex-column campo-input">
                        <label for="senha">Nova senha</label>
                        <div class="input-border">
                            <input type="password" name="senha" id="senha" class="form-control input-primario">
                        </div>
                    </div>
                    <div class="d-flex flex-column campo-input">
                        <label for="senha-confirmacao">Confirmar nova senha</label>
                        <div class="input-border">
                            <input type="password" name="senha-confirmacao" id="senha-confirmacao"
                                class="form-control input-primario">
                        </div>
                    </div>

                    <div class="d-flex gap-3 w-100">
                        <button type="button" class="botao-secundario ms-auto border-0 w-100"
                            data-bs-dismiss="modal">Voltar</button>
                        <button type="submit" id="btn-salvar-email" class="botao border-0 w-100">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div class="rounded-1" id="toast-indicador" style="width: 1em; height: 1em;"></div>
                <strong class="me-auto ms-2" id="toast-titulo"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-mensagem"></div>
        </div>
    </div>

    <script type="module" src="../js/recuperacao-senha.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
