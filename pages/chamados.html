<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/auth.js"></script>
    <script>verificarAut("Administrador");</script>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chamados.css">
    <title>PD Pets | Chamados</title>
</head>

<body>
    <!-- CONTEUDO -->
    <a href="dashboard-administrador.html" class="botao-secundario btn-voltar px-5">Voltar</a>
    <main class="container">
        <div class="d-flex flex-column align-items-center flex-md-row justify-content-md-between gap-3">
            <h1 id="titulo-pagina">Chamados de Clientes</h1>
            <button class="botao d-flex gap-2" id="btn-alternar"><i class="ti ti-message-circle-plus"></i> Ver
                solicitaçoes de lojistas</button>
        </div>

        <section>
            <div class="row g-3 mt-3" id="chamados-clientes">
            
            </div>
            <div class="row g-3 mt-3" style="display: none;" id="solicitacoes-lojista">
                
            </div>

            <!-- PAGINAÇÃO -->
            <nav class="mt-4" aria-label="Paginação">
                <ul class="pagination justify-content-end" id="paginacao">
                    
                </ul>
            </nav>
        </section>
    </main>

    <!-- MODAL DE CHAMADO -->
    <div class="modal fade" id="modalDetalhesChamado" tabindex="-1" aria-labelledby="modalDetalhesChamado"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 rounded-3">
                <h2 class="modal-titulo mb-1">Chamado</h2>
                <div class="d-flex flex-column gap-3 my-4" id="conversa-chamado">
                    
                </div>
                <form id="form-responder-chamado" class="row gy-2">
                    <div class="d-flex flex-column campo-input">
                        <div class="input-border">
                            <input type="text" name="resposta" id="resposta-chamado" class="form-control p-2 input-contato"
                                placeholder="Resposta" rows="5"></input>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-4">
                        <button type="button" class="botao-secundario px-0 w-50" data-bs-dismiss="modal">Voltar</button>
                        <button type="submit" class="botao px-0 w-50">Responder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <div id="toast-indicador" class="rounded-1" style="width: 1em; height: 1em;"></div>
                <strong id="toast-titulo" class="me-auto ms-2"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
            <div id="toast-mensagem" class="toast-body"></div>
        </div>
    </div>

    <script type="module" src="/js/chamados.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
